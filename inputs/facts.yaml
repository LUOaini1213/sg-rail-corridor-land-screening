# Sourced fact sheet: the single source of the legal and regulatory facts the screening uses.
# Not legal advice. Each row was checked against the cited document on the access date by reading its text.
# VERIFIED   = the quoted words were found in the cited document (statute rows: in the copy named in `basis`).
# UNVERIFIED = the document could not be read (reason in `basis`); the row is a pointer, not a fact.
# Quotes are kept short and are reproduced only to let a reader check the claim against the original.
# Rows with a `value` feed calculations; corridor.config.fact_value() refuses to use an UNVERIFIED row.

