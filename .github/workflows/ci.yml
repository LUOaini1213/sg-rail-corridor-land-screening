name: CI

# Offline checks on the committed study-area extract: no downloads, no API keys.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests (network access is blocked inside the test session)
        run: python -m pytest -q
      - name: Rebuild results, outputs and documents from the committed extract and compare
        run: python scripts/check_results.py

  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Every planted bug must make a behavioural test fail
        run: python scripts/mutate.py --record ci --require-all
